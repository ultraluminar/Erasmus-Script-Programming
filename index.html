<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamCal - Premium Team Calendar</title>
    <link rel="stylesheet" href="css/bootstrap.min.css"> <!-- Bootstrap CSS -->
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Custom CSS -->
    <script src="js/bootstrap.min.js"></script> <!-- Bootstrap JS -->
    <script src="script.js"></script> <!-- Custom JS -->
</head>
<body>
    <div class="d-flex vh-100 overflow-hidden bg-light">
        <!-- The Sidebar (The "Control Center") -->
        <aside class="d-flex flex-column flex-shrink-0 p-3 bg-white border-end shadow-sm" style="width: 280px; z-index: 10;">
            <div class="mb-4">
                <h2 class="h4 fw-bold text-primary" style="letter-spacing: -0.5px; color: var(--accent-color) !important;">TeamCal</h2>
            </div>

            <!-- Top Element: Mini-Calendar -->
            <div class="card border-0 bg-light p-3 mb-4 rounded-3">
                <div id="mini-calendar" class="d-flex justify-content-center align-items-center text-muted small ">
                    <!-- Content generated by JS -->
                </div>
            </div>

            <!-- Middle Element: Team Filters -->
            <div class="team-filters mb-auto overflow-auto">
                <h3 class="h6 text-uppercase text-muted fw-bold mb-3 small" style="letter-spacing: 0.5px;">Team Filters</h3>

                <div class="mb-4">
                    <h4 class="h6 fw-bold text-secondary mb-2">Design Team</h4>
                    <div class="d-flex align-items-center mb-2">
                        <input class="form-check-input me-3" type="checkbox" id="tm-1" checked style="cursor: pointer;">
                        <label class="d-flex align-items-center cursor-pointer text-dark text-decoration-none" for="tm-1" role="button">
                            <img src="https://i.pravatar.cc/150?u=a042581f4e29026024d" alt="Avatar" class="rounded-circle me-2 border border-white shadow-sm" width="32" height="32">
                            <span class="small">Sarah</span>
                        </label>
                    </div>
                     <div class="d-flex align-items-center mb-2">
                        <input class="form-check-input me-3" type="checkbox" id="tm-2" checked style="cursor: pointer;">
                        <label class="d-flex align-items-center cursor-pointer text-dark text-decoration-none" for="tm-2" role="button">
                            <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="Avatar" class="rounded-circle me-2 border border-white shadow-sm" width="32" height="32">
                            <span class="small">Mike</span>
                        </label>
                    </div>
                </div>
                 <div class="mb-4">
                    <h4 class="h6 fw-bold text-secondary mb-2">Dev Team</h4>
                    <div class="d-flex align-items-center mb-2">
                        <input class="form-check-input me-3" type="checkbox" id="tm-3" checked style="cursor: pointer;">
                        <label class="d-flex align-items-center cursor-pointer text-dark text-decoration-none" for="tm-3" role="button">
                            <img src="https://i.pravatar.cc/150?u=a042581f4e29026704e" alt="Avatar" class="rounded-circle me-2 border border-white shadow-sm" width="32" height="32">
                            <span class="small">John</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Bottom Element: My Status -->
            <div class="mt-auto pt-3 border-top">
                <div class="d-flex flex-column">
                    <span class="small fw-bold text-muted mb-2">My Status</span>
                    <select id="status-select" class="form-select status-select shadow-none border-secondary-subtle">
                        <option value="available">🟢 Available</option>
                        <option value="busy">🔴 Busy</option>
                        <option value="dnd">⛔ Do Not Disturb</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- The Calendar Grid -->
        <main class="d-flex flex-column flex-grow-1 overflow-hidden">
            <header class="d-flex justify-content-between align-items-center px-4 py-3 bg-white border-bottom shadow-sm z-1">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-secondary btn-sm px-3 btn-nav">Today</button>
                    <div class="btn-group nav-arrows">
                         <button class="btn btn-outline-secondary btn-sm border-end-0">&lt;</button>
                         <button class="btn btn-outline-secondary btn-sm">&gt;</button>
                    </div>
                </div>
                <div>
                    <h2 class="h5 fw-bold m-0" id="current-month-year">November 2024</h2>
                </div>
                <div>
                    <div class="btn-group view-switcher bg-light p-1 rounded-3">
                        <button class="btn btn-sm btn-link text-decoration-none text-secondary fw-medium view-btn border-0 rounded-2" data-view="day">Day</button>
                        <button class="btn btn-sm btn-light text-decoration-none text-primary fw-medium view-btn active shadow-sm border-0 rounded-2" data-view="week">Week</button>
                        <button class="btn btn-sm btn-link text-decoration-none text-secondary fw-medium view-btn border-0 rounded-2" data-view="timeline">Timeline</button>
                    </div>
                </div>
            </header>

            <div class="d-flex flex-grow-1 overflow-auto p-4 position-relative" id="calendar-grid">
                <!-- Grid will be populated by JS -->
                <div class="time-column flex-shrink-0 border-end pe-3 pt-2" style="width: 60px;">
                    <!-- Time slots -->
                </div>
                <div class="days-grid flex-grow-1 bg-white border rounded-3 border-start-0 rounded-start-0 position-relative">
                    <!-- Days columns -->
                </div>
            </div>
        </main>
    </div>

    <!-- The "Create Event" Modal -->
    <div class="modal fade" id="event-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-0 rounded-4">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold">Create Event</h5>
                    <button type="button" class="btn-close close-modal" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Title</label>
                        <input type="text" class="form-control" id="event-title" placeholder="Meeting Title">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Time</label>
                        <div class="d-flex gap-2 align-items-center">
                            <input type="time" class="form-control" id="event-start">
                            <span class="text-muted small">to</span>
                            <input type="time" class="form-control" id="event-end">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary">Add People</label>
                        <input type="text" class="form-control" id="add-people-input" placeholder="Search team members...">
                        <div id="availability-indicator" class="mt-2 p-2 rounded-2 small fw-medium d-none">
                            <!-- Dynamic feedback here -->
                        </div>
                    </div>
                    <div>
                         <button class="btn btn-primary w-100 py-2" id="save-event-btn" style="background-color: var(--accent-color); border: none;">Save Event</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
